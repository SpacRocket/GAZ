# Grafana reads plain JSON from the RDB, not the gateway.
#
# The gateway routes queries but holds no tables of its own, so there is
# nothing there to chart. The RDB holds today's ticking data and serves the
# derived views over HTTP — kdb+ serves IPC and HTTP on the same port, so 6002
# is both the q handle and the dashboard endpoint, with no extra listener.
#
# Infinity rather than the SimpleJSON plugin: that one is Angular-based, which
# Grafana 11.6 refuses to load at all. See code/rdb/http.q.
apiVersion: 1

datasources:
  - name: gaz-rdb
    # Fixed uid so provisioned dashboards can reference it; without this
    # Grafana generates a random one and panels resolve to nothing.
    uid: gaz-rdb
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      auth_method: none
      global_queries: []
      allowedHosts:
        - http://rdb:6002
