# One process per container, each in the foreground.
#
# The important difference from the local stack is the process file: the host
# column here holds service names, not `localhost`. TorQ identifies a process
# by matching the host column against its own hostname, and every peer resolves
# the discovery service through that same file — with `localhost` in a
# container, each process would look for its peers inside itself.
#
# Hence `hostname:` on every service. Docker defaults a container's hostname to
# its container ID, which matches no row, and TorQ exits with "Current host does
# not match host specified in". The value must equal the host column exactly.
#
# Build (the image installs KDB-X from KX's portal — see Dockerfile):
#   export KX_B64_LIC=$(base64 < ~/Applications/q/kc.lic | tr -d '\n')
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml up -d

x-gaz: &gaz
  build:
    context: ..
    dockerfile: docker/Dockerfile
    # The KDB-X installer refuses -y without a licence. Passed as a build
    # secret so it never lands in a layer or in git; the image deletes the
    # kc.lic the installer writes and uses the runtime mount below instead.
    #   export KX_B64_LIC=$(base64 < ~/Applications/q/kc.lic | tr -d '\n')
    secrets:
      - kxlic
  environment: &gazenv
    TORQPROCESSES: /app/docker/process.csv
    KDBBASEPORT: 6000
    GAZ_HDB: /fsx/hdb
    GAZ_WDB: /mnt/wdb
    GAZ_TPLOG: /mnt/tplog
    GAZ_LOG: /var/log/gaz
    # Read from your shell, never baked into the image or committed. Source it
    # before bringing the stack up:
    #   set -a; . ~/.secrets; set +a
    #   docker compose -f docker/docker-compose.yml up -d
    ENTSOE_API_KEY: ${ENTSOE_API_KEY:-}
  volumes:
    # Stands in for the FSx for OpenZFS mount. Shared by every reader.
    - hdb:/fsx/hdb
    # Your kc.lic / k4.lic — mounted, never baked into a layer.
    - ${QLIC:-${HOME}/Applications/q}:/etc/kdb:ro
  restart: unless-stopped

services:
  discovery:
    <<: *gaz
    hostname: discovery
    command: ["run", "discovery1"]

  # The tickerplant and its line handler: separate q processes, one container.
  # They share a hostname, which is why both rows in process.csv carry host
  # `stp` — TorQ matches that column against .z.h and exits if it differs.
  #
  # stp1 is the primary: the container lives and dies with the tickerplant, so
  # compose's `restart:` acts on it. feed1 is supervised alongside and restarts
  # in place, so a bad parse or a dropped exchange session never bounces the tp.
  # `init:` gives PID 1 a real reaper, since the entrypoint is now a shell.
  stp:
    <<: *gaz
    hostname: stp
    init: true
    # One handler per market. Three processes rather than one because the
    # three series must arrive independently — that asynchrony is what the
    # spark-spread as-of join exists to resolve — and because sim_power is
    # meant to be swapped for an ENTSO-E adapter on its own.
    command:
      - "run"
      - "stp1"
      - "--sidecar"
      - "python3 /app/code/tick/entsoe_power.py"
      - "--sidecar"
      - "python3 /app/code/tick/sim_power.py"
      - "--sidecar"
      - "python3 /app/code/tick/sim_gas.py"
      - "--sidecar"
      - "python3 /app/code/tick/sim_carbon.py"
    depends_on: [discovery]
    volumes:
      - hdb:/fsx/hdb
      - ${QLIC:-${HOME}/Applications/q}:/etc/kdb:ro
      # The recovery log gets its own volume: local block storage, never the
      # shared filesystem. In AWS this is an EBS io2/gp3 volume.
      - tplog:/mnt/tplog
      # Feed state — which (zone, delivery) points have already been published.
      # Without it a restart re-ingests the whole ENTSO-E window and the power
      # table fills with duplicate delivery periods.
      - state:/mnt/state

  rdb:
    <<: *gaz
    hostname: rdb
    command: ["run", "rdb1"]
    depends_on: [stp]
    # Dev convenience: query the RDB straight from the host with a local q.
    # The gateway on 6007 is the real client entry point — this is for poking
    # at intraday state directly. Note it collides with the local stack, which
    # uses the same {KDBBASEPORT}+n range, so don't run both at once.
    ports:
      - "6002:6002"
    volumes:
      - hdb:/fsx/hdb
      - ${QLIC:-${HOME}/Applications/q}:/etc/kdb:ro
      - tplog:/mnt/tplog        # needed to replay the log on restart

  wdb:
    <<: *gaz
    hostname: wdb
    command: ["run", "wdb1"]
    depends_on: [stp]
    volumes:
      - hdb:/fsx/hdb
      - ${QLIC:-${HOME}/Applications/q}:/etc/kdb:ro
      - tplog:/mnt/tplog
      - wdb:/mnt/wdb

  sort:
    <<: *gaz
    hostname: sort
    command: ["run", "sort1"]
    depends_on: [wdb]
    volumes:
      # The only service with the HDB mounted read-write. Every reader below
      # gets :ro, which is the container-level expression of the single-writer
      # rule the shared-filesystem layout depends on.
      - hdb:/fsx/hdb
      - ${QLIC:-${HOME}/Applications/q}:/etc/kdb:ro
      - wdb:/mnt/wdb
      # The sort subscribes to the tickerplant and replays its logs on startup,
      # so it needs to SEE them. Without this it fails with "could not replay
      # the log file ... No such file or directory" and exits 3 forever — the
      # reason EOD had never once run.
      - tplog:/mnt/tplog

  hdb1: &hdb
    <<: *gaz
    hostname: hdb1
    command: ["run", "hdb1"]
    depends_on: [discovery]
    volumes:
      - hdb:/fsx/hdb:ro
      - ${QLIC:-${HOME}/Applications/q}:/etc/kdb:ro

  hdb2:
    <<: *hdb
    hostname: hdb2
    command: ["run", "hdb2"]

  gateway:
    <<: *gaz
    hostname: gateway
    command: ["run", "gateway1"]
    depends_on: [rdb, hdb1]
    ports:
      - "6007:6007"     # the only port worth exposing to clients

  # Dashboards. Points at the rdb rather than the gateway — see the comment in
  # docker/grafana/provisioning/datasources/kdb.yml for why.
  #
  # Not built from the gaz Dockerfile, so no <<: *gaz here: it needs no q, no
  # licence and none of the data volumes.
  grafana:
    image: grafana/grafana:11.6.0
    hostname: grafana
    depends_on: [rdb]
    ports:
      - "3000:3000"
    environment:
      # Infinity: a maintained React datasource that reads the plain JSON the
      # RDB serves at /gaz/*. Replaces grafana-simple-json-datasource, which is
      # Angular-based — Grafana warns on every dashboard that uses it, disabled
      # Angular by default in 11 and removed the opt-out entirely in 11.6.
      # PINNED. Unpinned, this pulls the latest Infinity, and 4.0.0 requires
      # Grafana >=11.6.11 while this image is 11.6.0 — just under the floor.
      # The symptom is not a version error but a SystemJS 404 on
      # react/jsx-runtime, reported against whichever datasource you happen to
      # be looking at. 3.11.1 declares >=11.6.0-0.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource 3.11.1
      # Grafana 11 preinstalls Loki Explore and Pyroscope apps. Nothing here
      # uses them, and grafana-lokiexplore-app fails to load in the browser
      # (404 on react/jsx-runtime), which surfaces as a SystemJS error that
      # looks like the gaz-rdb datasource failing. Not installing them is the
      # fix; nothing in this stack needs either.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # Local dashboards only; nothing here should phone home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana's data directory is /var/lib/grafana itself — it holds
      # grafana.db and plugins/. Mounting the volume at .../data created an
      # unused empty directory and left plugin state in the container layer,
      # so every recreate reinstalled from scratch.
      - grafana:/var/lib/grafana
    restart: unless-stopped

volumes:
  hdb:
  wdb:
  tplog:
  state:
  grafana:

secrets:
  kxlic:
    environment: KX_B64_LIC
